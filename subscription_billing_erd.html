
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2830' : '#f0eefe',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    edgeLabelBackground: dark ? '#1a1a1a' : '#ffffff',
  },
});

const diagram = `erDiagram
  CUSTOMER {
    uuid id PK
    string name
    string email
    string phone
    string company
    string billing_address
    string tax_id
    enum status
    timestamp created_at
    timestamp updated_at
  }

  PLAN {
    uuid id PK
    string name
    string description
    decimal base_price
    enum billing_cycle
    enum plan_type
    int trial_days
    boolean is_active
    timestamp created_at
  }

  PLAN_FEATURE {
    uuid id PK
    uuid plan_id FK
    string feature_name
    string feature_value
    string unit
  }

  SUBSCRIPTION {
    uuid id PK
    uuid customer_id FK
    uuid plan_id FK
    enum status
    date start_date
    date end_date
    date trial_end_date
    date next_billing_date
    decimal current_mrr
    int quantity
    timestamp created_at
    timestamp updated_at
  }

  SUBSCRIPTION_ADDON {
    uuid id PK
    uuid subscription_id FK
    string addon_name
    decimal price
    int quantity
  }

  DISCOUNT {
    uuid id PK
    string code
    enum discount_type
    decimal value
    date valid_from
    date valid_until
    int max_uses
    int used_count
    boolean is_active
  }

  SUBSCRIPTION_DISCOUNT {
    uuid id PK
    uuid subscription_id FK
    uuid discount_id FK
    date applied_at
    date expires_at
  }

  BILLING_JOB {
    uuid id PK
    date scheduled_date
    enum status
    int subscriptions_processed
    int invoices_generated
    decimal total_amount
    timestamp started_at
    timestamp completed_at
    string error_log
  }

  INVOICE {
    uuid id PK
    uuid subscription_id FK
    uuid billing_job_id FK
    string invoice_number
    date issue_date
    date due_date
    decimal subtotal
    decimal discount_amount
    decimal tax_amount
    decimal total_amount
    enum status
    string notes
    timestamp created_at
  }

  INVOICE_LINE_ITEM {
    uuid id PK
    uuid invoice_id FK
    string description
    int quantity
    decimal unit_price
    decimal discount_amount
    decimal line_total
  }

  TAX_RULE {
    uuid id PK
    string name
    string region
    decimal rate
    enum tax_type
    boolean is_active
  }

  PAYMENT {
    uuid id PK
    uuid invoice_id FK
    uuid payment_method_id FK
    decimal amount
    enum status
    string transaction_id
    string gateway_response
    timestamp paid_at
    timestamp created_at
  }

  PAYMENT_METHOD {
    uuid id PK
    uuid customer_id FK
    enum method_type
    string provider_token
    string last_four
    date expiry_date
    boolean is_default
    boolean is_active
    timestamp created_at
  }

  DUNNING_EVENT {
    uuid id PK
    uuid invoice_id FK
    enum event_type
    int attempt_number
    timestamp scheduled_at
    timestamp sent_at
    enum status
  }

  USER {
    uuid id PK
    string name
    string email
    string password_hash
    enum role
    boolean is_active
    timestamp last_login
    timestamp created_at
  }

  AUDIT_LOG {
    uuid id PK
    uuid user_id FK
    string entity_type
    uuid entity_id
    enum action
    jsonb old_values
    jsonb new_values
    string ip_address
    timestamp created_at
  }

  CUSTOMER ||--o{ SUBSCRIPTION : "has"
  CUSTOMER ||--o{ PAYMENT_METHOD : "owns"
  PLAN ||--o{ SUBSCRIPTION : "applied to"
  PLAN ||--o{ PLAN_FEATURE : "includes"
  SUBSCRIPTION ||--o{ SUBSCRIPTION_ADDON : "has"
  SUBSCRIPTION ||--o{ SUBSCRIPTION_DISCOUNT : "uses"
  SUBSCRIPTION ||--o{ INVOICE : "generates"
  DISCOUNT ||--o{ SUBSCRIPTION_DISCOUNT : "applied via"
  BILLING_JOB ||--o{ INVOICE : "produces"
  INVOICE ||--o{ INVOICE_LINE_ITEM : "contains"
  INVOICE ||--o{ PAYMENT : "settled by"
  INVOICE ||--o{ DUNNING_EVENT : "triggers"
  PAYMENT_METHOD ||--o{ PAYMENT : "used in"
  TAX_RULE }o--o{ INVOICE : "applied to"
  USER ||--o{ AUDIT_LOG : "generates"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
